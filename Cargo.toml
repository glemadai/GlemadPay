[package]
name = "glemad-pay"
version = "1.1.0"
edition = "2021"
description = "Official Glemad Pay server SDK"
repository = "https://github.com/glemadai/GlemadPay"

[lib]
path = "rust/src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
